name: IndianDayTrader
options:
  bundleIdPrefix: com.iamsanaur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  IndianDayTrader:
    type: application
    platform: iOS
    sources: [IndianDayTrader]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamsanaur.indiandaytrader
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Day Trader"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing QR code printed by idt serve."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to your self-hosted Indian Day Trader server on this network."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: IndianDayTrader/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.iamsanaur.indiandaytrader.pair
            CFBundleURLSchemes: [idt]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  IndianDayTraderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IndianDayTraderTests]
    dependencies:
      - target: IndianDayTrader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.iamsanaur.indiandaytrader.tests
schemes:
  IndianDayTrader:
    build:
      targets:
        IndianDayTrader: all
        IndianDayTraderTests: [test]
    test:
      targets: [IndianDayTraderTests]
    run:
      commandLineArguments:
        "-idtURL http://localhost:8742": false
        "-idtToken demo-token": false
