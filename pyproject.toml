[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-day-trader"
version = "0.1.1"
description = "Claude skills for intraday trading on NSE/BSE: index charts, F&O analytics, sizing, risk gate, broker-neutral tickets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "plotly>=5.18",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "qrcode>=7.4"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "qrcode>=7.4"]

[project.scripts]
idt = "idt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idt = ["server/web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
