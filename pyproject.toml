[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-day-trader"
version = "0.1.0"
description = "Claude skills for intraday trading on NSE/BSE: index charts, F&O analytics, sizing, risk gate, broker-neutral tickets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
idt = "idt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
